[project]
name = "bmoral"
version = "0.1.0"
description = "British Moral Philosophy corpus: OCR, concept maps, semantic search"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "numpy>=1.26.0",
    "pymupdf>=1.25.0",
    "huggingface-hub>=0.27.0",
    # web search for the chat agent; drives real search engines rather than
    # scraping a results page. Optional at runtime — the tools fall back to the
    # Wikipedia and Open Library APIs if it is absent.
    "ddgs>=9.5",
]

[tool.uv]
# keep everything in the project venv
