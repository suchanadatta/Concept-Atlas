# GLM-OCR self-hosted configuration for the BMoral corpus
# OCR server: local vLLM serving /store/shuvam/BMoral/models/GLM-OCR

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

logging:
  level: INFO

pipeline:
  maas:
    enabled: false          # self-hosted mode (local vLLM)
    api_key: null

  ocr_api:
    api_host: 127.0.0.1
    api_port: 8080
    model: glm-ocr          # matches --served-model-name
    api_scheme: http
    api_path: /v1/chat/completions
    api_mode: openai
    api_key: null
    headers: {}
    verify_ssl: false
    connect_timeout: 30
    request_timeout: 600    # long pages/regions can be slow
    retry_max_attempts: 3
    retry_backoff_base_seconds: 1.0
    retry_backoff_max_seconds: 16.0
    retry_jitter_ratio: 0.2
    retry_status_codes: [429, 500, 502, 503, 504]
    connection_pool_size: 128

  max_workers: 16           # concurrent region OCR requests
  page_maxsize: 100
  region_maxsize: 2000

  page_loader:
    max_tokens: 8192
    temperature: 0.0
    top_p: 0.00001
    top_k: 1
    repetition_penalty: 1.1
    t_patch_size: 2
    patch_expand_factor: 1
    image_expect_length: 6144
    image_format: JPEG
    min_pixels: 12544
    max_pixels: 71372800
    task_prompt_mapping:
      text: "Text Recognition:"
      table: "Table Recognition:"
      formula: "Formula Recognition:"
    pdf_dpi: 300            # quality-first: 300 dpi for 18th-c small print
    pdf_max_pages: null
    pdf_verbose: false

  result_formatter:
    output_format: both     # markdown + json
    enable_merge_formula_numbers: true
    enable_merge_text_blocks: true
    enable_format_bullet_points: true
    # Book-level two-up overrides (book_id = sanitized PDF stem).
    # Evidence: same scan family as King 1st ed (verified two-up); full-height
    # right-half ink on loose pages. Override list is user-reviewable.
    book_sheet_overrides:
      "King An Essay on the Origin of Evil 2nd ed 1732 vol. 2 (part 1)": "two_up"
      "Burnet A Method of Devotion (part 1)": "two_up"
      "Burnet A Method of Devotion (part 2)": "two_up"


  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    threshold: 0.3
    batch_size: 1
    workers: 1
    cuda_visible_devices: "0"
    use_polygon: false
    layout_nms: true
    layout_unclip_ratio: [1.0, 1.0]
    layout_merge_bboxes_mode:
      0: large
      1: large
      2: large
      3: large
      4: large
      5: large
      6: large
      7: large
      8: large
      9: large
      10: large
      11: large
      12: large
      13: large
      14: large
      15: large
      16: large
      17: large
      18: small
      19: large
      20: large
      21: large
      22: large
      23: large
      24: large
    label_task_mapping:
      text: [abstract, algorithm, content, doc_title, figure_title, paragraph_title, reference_content, text, vertical_text, vision_footnote, seal, formula_number, header, footer, footnote, aside_text, reference, number]
      table: [table]
      formula: [display_formula, inline_formula]
      skip: [chart, image]
      abandon: [footer_image, header_image]
    id2label:
      0: abstract
      1: algorithm
      2: aside_text
      3: chart
      4: content
      5: display_formula
      6: doc_title
      7: figure_title
      8: footer
      9: footer_image
      10: footnote
      11: formula_number
      12: header
      13: header_image
      14: image
      15: inline_formula
      16: number
      17: paragraph_title
      18: reference
      19: reference_content
      20: seal
      21: table
      22: text
      23: vertical_text
      24: vision_footnote
